<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma première page</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #f8d7e8, #d8c7ff);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

.carte {
background: white;
width: 80%;
max-width: 600px;
padding: 50px;
border-radius: 25px;
text-align: center;
box-shadow: 0 15px 40px rgba(0,0,0,0.15);
}

h1 {
color: #8e44ad;
font-size: 42px;
margin-bottom: 15px;
}

p {
color: #555;
font-size: 18px;
line-height: 1.6;
}

button {
background: #8e44ad;
color: white;
border: none;
padding: 15px 30px;
border-radius: 30px;
font-size: 17px;
cursor: pointer;
margin-top: 20px;
}

button:hover {
background: #6c3483;
}
</style>
</head>

<body>

<div class="carte">
<h1>Bienvenue ✨</h1>

<p>
Voici ma première vraie interface web.
Elle est créée avec HTML et CSS.
</p>

<button>Découvrir</button>
</div>

</body>
</html>
