<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Léa beauty ✨</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, sans-serif;
background: #fff8fa;
color: #222;
}

header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 8%;
background: white;
border-bottom: 1px solid #eee;
}

.logo {
font-size: 26px;
font-weight: bold;
}

nav a {
margin-left: 25px;
text-decoration: none;
color: #222;
}

.hero {
min-height: 75vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
padding: 40px 20px;
background: linear-gradient(135deg, #fce8ef, #f8d3df);
}

.hero h1 {
font-size: 60px;
margin: 0 0 15px;
}

.hero p {
font-size: 21px;
margin-bottom: 30px;
}

.button {
display: inline-block;
padding: 15px 32px;
background: #222;
color: white;
text-decoration: none;
border-radius: 30px;
}

.products {
padding: 60px 8%;
text-align: center;
}

.products h2 {
font-size: 35px;
margin-bottom: 40px;
}

.product-grid {
display: flex;
justify-content: center;
gap: 25px;
flex-wrap: wrap;
}

.product {
background: white;
width: 280px;
padding: 25px;
border-radius: 20px;
box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.product h3 {
margin-bottom: 10px;
}

footer {
text-align: center;
padding: 30px;
background: #222;
color: white;
}
</style>
</head>

<body>

<header>
<div class="logo">Léa beauty ✨</div>

<nav>
<a href="#">Accueil</a>
<a href="#produits">Produits</a>
<a href="#">Contact</a>
</nav>
</header>

<section class="hero">
<h1>L-a-beauty</h1>
<p>La beauté commence ici ✨</p>
<a href="#produits" class="button">Découvrir</a>
</section>

<section class="products" id="produits">
<h2>Nos produits</h2>

<div class="product-grid">

<div class="product">
<h3>Produit beauté</h3>
<p>Découvrez bientôt notre sélection.</p>
</div>

<div class="product">
<h3>Nouveauté</h3>
<p>Un nouvel article arrive bientôt.</p>
</div>

<div class="product">
<h3>Best-seller</h3>
<p>Notre produit phare arrive bientôt.</p>
</div>

</div>
</section>

<footer>
© 2026 L-a-beauty — Tous droits réservés
</footer>

</body>
</html>
