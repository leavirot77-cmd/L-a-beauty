<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma première boutique</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: linear-gradient(135deg, #f8e8ee, #f5d6df);
color: #333;
text-align: center;
}

.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 30px;
box-sizing: border-box;
}

h1 {
font-size: 52px;
margin-bottom: 15px;
}

p {
font-size: 20px;
margin-bottom: 30px;
}

.button {
display: inline-block;
padding: 15px 30px;
background: #333;
color: white;
text-decoration: none;
border-radius: 30px;
font-size: 18px;
}

.button:hover {
transform: scale(1.05);
}
</style>
</head>

<body>

<div class="hero">
<h1>Bienvenue ✨</h1>

<p>
Découvrez mon univers.
</p>

<a href="#" class="button">Découvrir</a>
</div>

</body>
</html>
